services:
  studio-sync:
    image: gpt-img-studio-sync:0.1.0
    container_name: gpt-img-studio-sync
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpu_shares: 512
    environment:
      STUDIO_SYNC_DATA: /data
      STUDIO_SYNC_TOKENS: /run/secrets/devices.json
      TOKIO_WORKER_THREADS: 2
    volumes:
      - ./data:/data
      - ./secrets:/run/secrets:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      proxy:
        aliases: [gpt-img-studio-sync]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
networks:
  proxy:
    external: true
    name: reverse-proxy
