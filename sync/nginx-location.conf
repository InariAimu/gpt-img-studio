# Inside the existing app.example.com TLS server block.
location = /studio-sync { absolute_redirect off; return 308 /studio-sync/; }
location ^~ /studio-sync/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $studio_sync_backend gpt-img-studio-sync:8080;
    rewrite ^/studio-sync/(.*)$ /$1 break;
    proxy_pass http://$studio_sync_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    client_max_body_size 128m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
