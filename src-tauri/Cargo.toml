[package]
name = "gpt-img-studio"
version = "0.1.0"
license = "MIT"
edition = "2021"
description = "A local image generation and experimentation workspace"

[lib]
name = "gpt_img_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "system-proxy", "socks"] }
hyper-util = { version = "0.1", features = ["client-proxy", "client-proxy-system"] }
tokio = { version = "1", features = ["time"] }
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
keyring = { version = "3", features = ["windows-native"] }
rust_decimal = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
