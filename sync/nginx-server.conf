# Included under http {}, alongside the existing certificate directives.
# The existing *.inariaimu.synology.me certificate also covers this hostname.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gis.inariaimu.synology.me;

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $studio_sync_backend gpt-img-studio-sync:8080;
        proxy_pass http://$studio_sync_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 41658;
        proxy_set_header Connection "";
        client_max_body_size 128m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
